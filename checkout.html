<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — DEWED</title><meta name="robots" content="noindex"><link rel="icon" href="assets/logo/dewed-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div>
<main class="wrap"><div class="pagehd"><h1 style="font-size:clamp(2.4rem,5vw,4rem)">Checkout</h1></div><div id="empty" class="none" hidden><h3>Your bag is empty</h3><a class="btn dark" href="shop.html" style="margin-top:20px">Continue shopping</a></div>
<div class="co" id="co"><form id="f" novalidate><fieldset><legend>Contact</legend><div class="rowf"><div class="fld"><label for="fname">Full name</label><input id="fname" name="fname" autocomplete="name"><span class="err" id="e_fname"></span></div><div class="fld"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit number"><span class="err" id="e_phone"></span></div></div><div class="fld"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="err" id="e_email"></span></div></fieldset>
<fieldset><legend>Delivery address</legend><div class="fld"><label for="a1">House / flat, street</label><input id="a1" name="a1" autocomplete="address-line1"><span class="err" id="e_a1"></span></div><div class="fld"><label for="a2">Area, landmark (optional)</label><input id="a2" name="a2" autocomplete="address-line2"><span class="err" id="e_a2"></span></div><div class="rowf"><div class="fld"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2"><span class="err" id="e_city"></span></div><div class="fld"><label for="state">State</label><select id="state" autocomplete="address-level1"><option value="">Select state</option></select><span class="err" id="e_state"></span></div><div class="fld"><label for="pin">PIN code</label><input id="pin" name="pin" inputmode="numeric" maxlength="6" autocomplete="postal-code"><span class="err" id="e_pin"></span></div></div></fieldset>
<fieldset><legend>Delivery method</legend><label class="choice"><input type="radio" name="ship" value="std" checked><span><b>Standard</b><span class="meta">Delivered in 4–6 days</span></span><span class="pp" id="pStd"></span></label><label class="choice"><input type="radio" name="ship" value="exp"><span><b>Express</b><span class="meta">Delivered in 2–3 days</span></span><span class="pp">₹199</span></label></fieldset>
<fieldset><legend>Payment</legend><label class="choice"><input type="radio" name="pay" value="upi" checked><span><b>UPI</b><span class="meta">Pay with any UPI app</span></span></label><div class="payf show" id="p_upi"><div class="fld"><label for="upi">UPI ID</label><input id="upi" name="upi" placeholder="name@bank" autocomplete="off"><span class="err" id="e_upi"></span></div></div>
<label class="choice"><input type="radio" name="pay" value="card"><span><b>Credit / debit card</b></span></label><div class="payf" id="p_card"><div class="fld"><label for="cname">Name on card</label><input id="cname" name="cname" autocomplete="cc-name"><span class="err" id="e_cname"></span></div><div class="fld"><label for="cnum">Card number</label><input id="cnum" name="cnum" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="0000 0000 0000 0000"><span class="err" id="e_cnum"></span></div><div class="rowf"><div class="fld"><label for="cexp">Expiry (MM/YY)</label><input id="cexp" name="cexp" maxlength="5" autocomplete="cc-exp" placeholder="MM/YY"><span class="err" id="e_cexp"></span></div><div class="fld"><label for="ccvv">CVV</label><input id="ccvv" name="ccvv" type="password" inputmode="numeric" maxlength="4" autocomplete="cc-csc"><span class="err" id="e_ccvv"></span></div></div></div>
<label class="choice"><input type="radio" name="pay" value="nb"><span><b>Net banking</b></span></label><div class="payf" id="p_nb"><div class="fld"><label for="bank">Bank</label><select id="bank"><option value="">Select bank</option><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option><option>Axis Bank</option><option>Kotak Mahindra Bank</option><option>Punjab National Bank</option></select><span class="err" id="e_bank"></span></div></div>
<label class="choice"><input type="radio" name="pay" value="cod"><span><b>Cash on delivery</b><span class="meta">Pay when your order arrives</span></span><span class="pp">+₹49</span></label>
<p class="note">Demo storefront: no payment is processed and no card details are stored. Connect a payment gateway before going live.</p></fieldset>
<button class="btn dark big" type="submit" id="place">Place order</button></form>
<aside class="sum" aria-label="Order summary"><h3>Order summary</h3><div id="lines"></div><div id="tot" style="margin-top:14px"></div></aside></div></main>
<div id="site-footer"></div><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/checkout.js"></script><script>layout();initCheckout()</script></body></html>
