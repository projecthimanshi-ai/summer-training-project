<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — DEWED</title><meta name="description" content="DEWED. Beauty, refined."><meta property="og:title" content="Shop — DEWED"><meta property="og:image" content="assets/logo/dewed-logo.png"><link rel="icon" href="assets/logo/dewed-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div>
<main class="wrap"><div class="pagehd"><h1 id="ttl" style="font-size:clamp(2.6rem,6vw,5rem)">Shop all</h1><p id="sub" style="margin-top:10px;color:#6f5a52"></p></div>
<div class="shop"><form class="flt" id="flt" aria-label="Filters"><fieldset><legend>Category</legend><div id="fCat"></div></fieldset><fieldset><legend>Product type</legend><div id="fType"></div></fieldset>
<fieldset><legend>Max price: <span id="pv"></span></legend><input type="range" id="fPrice" min="400" max="1800" step="50" value="1800" aria-label="Maximum price"></fieldset>
<fieldset><legend>Shade range</legend><label><input type="radio" name="sh" value="0" checked> Any</label><label><input type="radio" name="sh" value="6"> 6+ shades</label><label><input type="radio" name="sh" value="12"> 12+ shades</label><label><input type="radio" name="sh" value="20"> 20+ shades</label></fieldset>
<fieldset><legend>Finish</legend><div id="fFin"></div></fieldset><fieldset><legend>Availability</legend><label><input type="checkbox" id="fStock"> In stock only</label></fieldset><button type="reset" class="ul sm" id="reset">Clear all</button></form>
<div><div class="bar"><button class="fbtn sm" id="fb">Filters</button><span id="cnt" class="meta"></span><label class="sm">Sort <select id="sort"><option value="feat">Featured</option><option value="best">Bestselling</option><option value="new">Newest</option><option value="lo">Price: Low to High</option><option value="hi">Price: High to Low</option></select></label></div><div class="grid" id="res"></div></div></div></main>
<div id="site-footer"></div><script src="js/products.js"></script><script src="js/main.js"></script><script src="js/shop.js"></script><script>layout();</script></body></html>
